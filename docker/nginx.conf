map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 800m;
    charset utf-8;
    server_tokens off;

    error_page 404 /404.html;

    location = /404.html {
        root /var/www/mqlt-web;
        try_files /404.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    # Public homepage (patched host file)
    location = / {
        rewrite ^ /index.html last;
    }

    location = /index.html {
        root /var/www/mqlt-web;
        try_files /index.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    location ~ ^/(logo\.png|hero\.jpg|campus\.jpg|pasture\.jpg)$ {
        return 302 http://127.0.0.1:8080/web$uri;
    }

    location = /process.html {
        root /var/www/mqlt-web;
        try_files /process.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /css/ {
        return 302 http://127.0.0.1:8080/web$request_uri;
    }

    location ^~ /images/ {
        return 302 http://127.0.0.1:8080/web$request_uri;
    }

    location ^~ /policy/ {
        alias /var/www/mqlt-web/policy/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /views/ {
        alias /var/www/mqlt-web/views/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /news/ {
        alias /var/www/mqlt-web/news/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /share/ {
        alias /var/www/mqlt-web/share/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /courses/ {
        alias /var/www/mqlt-web/courses/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /bases/ {
        alias /var/www/mqlt-web/bases/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /routes/ {
        alias /var/www/mqlt-web/routes/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(landing\.css|landing-motion\.js|favicon\.svg|favicon\.png|favicon-64\.png|favicon\.ico|favicon\.jpg|logo\.svg|logo-256\.png|apple-touch-icon\.png|apple-touch-icon\.jpg|app-icon\.png|icon\.jpg)$ {
        root /var/www/mqlt-web;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Console SPA from host console-web
    location = /console {
        return 302 /console/;
    }

    location = /console/ {
        rewrite ^ /console/index.html last;
    }

    location = /console/index.html {
        default_type text/html;
        charset utf-8;
        alias /var/www/console-web/dist/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    location ^~ /console/vendor/ {
        return 302 http://127.0.0.1:8080$request_uri;
    }

    location ^~ /console/static/ {
        return 302 http://127.0.0.1:8080$request_uri;
    }

    location ~ ^/console/.+ {
        default_type text/html;
        charset utf-8;
        alias /var/www/console-web/dist/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    # Match previous public vhost: hide these exact paths
    location = /mqlt {
        return 404;
    }
    location = /mqlt/ {
        return 404;
    }
    location = /mqlt/console {
        return 404;
    }
    location ^~ /mqlt/console/ {
        return 404;
    }

    location = /mqlt/healthz {
        proxy_pass http://api:3000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/healthz {
        proxy_pass http://api:3000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://api:3000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # H5 files before /api/v1/ API prefix (exact match still wins)
    location = /api/v1/study/h5/sdk.js {
        alias /var/www/mqlt-web/mqlt-h5-sdk.js;
        default_type application/javascript;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300";
    }

    location = /api/v1/study/h5/demo.html {
        alias /var/www/mqlt-web/mqlt-h5-demo.html;
        default_type text/html;
        charset utf-8;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=60";
    }

    location = /api/v1/study/h5/template.html {
        alias /var/www/mqlt-web/mqlt-h5-template.html;
        default_type text/html;
        charset utf-8;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=120";
    }

    location = /api/v1 {
        return 404;
    }
    location = /api/v1/ {
        return 404;
    }

    location ^~ /api/v1/ {
        proxy_pass http://api:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        client_max_body_size 800m;
    }

    # old public shape kept for compatibility
    location ^~ /mqlt/auth/ {
        proxy_pass http://api:3000/v1/auth/;
        include /opt/mqlt/runtime/proxy_params.conf;
    }
    location ^~ /mqlt/user/ {
        proxy_pass http://api:3000/v1/user/;
        include /opt/mqlt/runtime/proxy_params.conf;
    }
    location ^~ /mqlt/study/ {
        proxy_pass http://api:3000/v1/study/;
        include /opt/mqlt/runtime/proxy_params.conf;
    }
    location ^~ /mqlt/puzzles/ {
        proxy_pass http://api:3000/v1/puzzles/;
        include /opt/mqlt/runtime/proxy_params.conf;
    }
    location ^~ /mqlt/mall/ {
        proxy_pass http://api:3000/v1/mall/;
        include /opt/mqlt/runtime/proxy_params.conf;
    }
    location ^~ /mqlt/feedback {
        proxy_pass http://api:3000/v1/feedback;
        include /opt/mqlt/runtime/proxy_params.conf;
    }
    location ^~ /mqlt/admin/ {
        proxy_pass http://api:3000/v1/admin/;
        include /opt/mqlt/runtime/proxy_params.conf;
    }
    location ^~ /mqlt/commerce/ {
        proxy_pass http://api:3000/v1/commerce/;
        include /opt/mqlt/runtime/proxy_params.conf;
    }
    location ^~ /mqlt/uploads/ {
        proxy_pass http://api:3000/v1/uploads/;
        include /opt/mqlt/runtime/proxy_params.conf;
    }

    location ^~ /mqlt/api/ {
        return 404;
    }

    location = /mqlt/index.html {
        root /var/www/mqlt-web;
        try_files /index.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location /mqlt/ {
        alias /var/www/mqlt/;
        index index.html;
        try_files $uri $uri/ /mqlt/index.html;
    }
}
